# NEKpress catalog: the one file to edit.
#
# Every page and every link on the site is generated from this file by build.py.
# Each title is one [[book]] entry. The fields:
#
#   id          short unique name (letters, digits, hyphens); other entries refer to it
#   title       main title;  subtitle  the part after the colon (optional)
#   shelf       which page it goes on: one of the [[shelf]] slugs below
#   group       the heading it sits under on that page (optional; must be one of the shelf's groups)
#   show        "featured" (its shelf page AND the home page), "listed" (its shelf page; the default),
#               or "hidden" (kept here as a record, never on the site)
#   kindle      Kindle ASIN;  paperback  paperback ASIN. The Amazon store is set once, in [site].
#   doi         a Zenodo DOI for a free edition. Use the concept DOI ("Cite all versions") when known;
#               mark a version DOI with  version_doi = true  and build.py will list it as a reminder.
#   doi_label   link text for the DOI on a book's card (default "Free edition")
#   supplements the id of the book this free record goes with; it then also appears on that book's card
#   link        link text used on that book's card (for example "Free quick-start guide")
#   code        companion code repository
#   number      a small label above the title, such as "Book 3"
#   author      only for books by other authors (Shakespeare, Dickens, Poe ...)
#   play, kind  Shakespeare only: the play, and "annotated" or "guide"; the shelf pairs them in one row
#   blurb       one line under the title (optional)
#   status      a note to yourself, such as "draft"; never shown
#   disclaimer  text that must appear on any page that shows this entry
#
# To hide a title: show = "hidden". To add one: copy an entry, change it, run  python3 build.py.

[site]
title = "NEKpress"
author = "Nicholas Elliott Karlson"
# The permanent address. Canonical links and the sitemap use it. Do not give this repository a
# custom domain: that would make every github.io link redirect to the domain.
url = "https://nicholaskarlson.github.io"
# Every Amazon link is built as https://<amazon>/dp/<ASIN>. KDP ASINs are the same in every
# Amazon store, so this one line moves the whole site to another store, e.g. "www.amazon.ca".
amazon = "www.amazon.com"
tagline = "Books by Nicholas Elliott Karlson"
intro = "Statistics and research methods, practical AI, Shakespeare, and annotated classics. The books are on Amazon; the free editions, guides and workbooks are on Zenodo."
email = "nicholaskarlson@gmail.com"
github = "https://github.com/nicholaskarlson"
youtube = "https://www.youtube.com/@nicholaskarlson"
zenodo = "https://zenodo.org/communities/nekpress"
orcid = "0000-0001-7241-1587"

# ---------------------------------------------------------------- shelves (one page each)
# A shelf page is made only if at least one of its titles is shown, and the menu follows this order.
# A slug must not be the name of a repository that publishes its own Pages site (e.g. "longitudinal").

[[shelf]]
slug = "statistics"
title = "Statistics and Research Methods"
menu = "Statistics"
intro = "NEKpress Research: Proof-First Guides. Every printed number can be recomputed from public files. The free editions, quick-start guides and workbooks are on Zenodo."
groups = ["NEKpress Research: Proof-First Guides"]
free_list = true

[[shelf]]
slug = "ai"
title = "Practical AI"
menu = "Practical AI"
intro = "NEKpress Practical AI Guides: using AI for writing, study, communication and creative work, with your own judgment in charge."

[[shelf]]
slug = "shakespeare"
title = "Shakespeare"
menu = "Shakespeare"
intro = "Annotated editions of the plays, and a dictionary, pronunciation and study guide for many of them. The plays are grouped as in the First Folio of 1623."
layout = "plays"
groups = ["Comedies", "Histories", "Tragedies", "For readers and book clubs"]

[[shelf]]
slug = "literature"
title = "Classic Literature"
menu = "Literature"
intro = "Annotated editions of classic stories, and the Dickens Historical Editions of The Pickwick Papers."
groups = ["Dickens Historical Editions", "Great Literature"]

[[shelf]]
slug = "code"
title = "Code and Story Games"
menu = "Code"
intro = "Proof-first software books, and the Story Game series of interactive fiction."
groups = ["The Verifiable Pipeline Series", "The Story Game Series", "Ubuntu Cloud Skills"]

[[shelf]]
slug = "religion"
title = "Religious Studies"
menu = "Religious Studies"
intro = "Annotated public-domain editions of the Douay–Rheims translation."

[[shelf]]
slug = "other"
title = "Other"
menu = "Other"
intro = ""

